<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pro Gaming Setup Builder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

  <h1>🎮 Pro Gaming Setup Builder</h1>
  <p class="subtitle">1-click gaming setup generator</p>

  <!-- MODE BUTTONS -->
  <div class="buttons">
    <button onclick="setMode('fps')">🔥 FPS Pro Setup</button>
    <button onclick="setMode('rgb')">🌈 RGB Setup</button>
    <button onclick="setMode('budget')">💰 Budget Setup</button>
    <button onclick="setMode('creamy')">🧊 Creamy White Setup</button>
  </div>

  <hr>

  <!-- CUSTOM INPUT -->
  <textarea id="customText" placeholder="Or type your own setup:
e.g. black keyboard, LED mouse, headset"></textarea>

  <input id="budget" type="number" placeholder="Budget ($) e.g. 200" />

  <select id="sort">
    <option value="relevance">Best Match</option>
    <option value="low">Price: Low → High</option>
    <option value="high">Price: High → Low</option>
    <option value="name">Name</option>
  </select>

  <button onclick="buildSetup()">Build Setup</button>

  <div id="results"></div>

</div>

<script src="app.js"></script>
</body>
</html>
