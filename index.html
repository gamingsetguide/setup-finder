<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Setup Builder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">

    <h1>🎮 AI Setup Builder</h1>
    <p class="subtitle">Type anything. Get a full gaming setup.</p>

    <textarea id="query" placeholder="Example:
I want a black keyboard, LED mouse, headset with RGB"></textarea>

    <input id="budget" type="number" placeholder="Budget ($) e.g. 200" />

    <select id="sort">
      <option value="relevance">Sort: Best Match</option>
      <option value="low">Price: Low → High</option>
      <option value="high">Price: High → Low</option>
      <option value="name">Name</option>
    </select>

    <button onclick="buildSetup()">Build My Setup</button>

    <div id="results"></div>

  </div>

  <script src="app.js"></script>
</body>
</html>
