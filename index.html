<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Setup Finder Pro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">

    <h1>🎮 Setup Finder Pro</h1>
    <p class="subtitle">Find the perfect gaming gear instantly</p>

    <input id="search" placeholder="Search gear (keyboard, mouse, etc...)" />

    <div class="filters">

      <input id="budget" type="number" placeholder="Max Budget ($)" />

      <select id="type">
        <option value="">Any Type</option>
        <option value="keyboard">Keyboard</option>
        <option value="mouse">Mouse</option>
      </select>

      <select id="color">
        <option value="">Any Color</option>
        <option value="white">White</option>
        <option value="black">Black</option>
      </select>

      <select id="sound">
        <option value="">Any Sound</option>
        <option value="creamy">Creamy</option>
        <option value="clicky">Clicky</option>
        <option value="silent">Silent</option>
      </select>

      <button onclick="searchProducts()">Find Best Match</button>

    </div>

    <div id="results"></div>

  </div>

  <script src="app.js"></script>
</body>
</html>
