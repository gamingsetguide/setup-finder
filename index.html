<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pro Gaming Setup Builder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

  <h1>🎮 Pro Gaming Setup Builder</h1>
  <p class="subtitle">Build full gaming setups instantly</p>

  <!-- MODE SWITCH -->
  <button onclick="toggleMode()" id="modeBtn">Switch to FULL SETUP MODE</button>

  <!-- SINGLE MODE -->
  <div id="singleMode">

    <input id="query" placeholder="e.g. black keyboard rgb mouse" />
    <input id="singleBudget" type="number" placeholder="Budget ($)" />

    <select id="singleSort">
      <option value="best">Best Match</option>
      <option value="low">Price Low → High</option>
      <option value="high">Price High → Low</option>
      <option value="name">Name</option>
    </select>

    <button onclick="searchProducts()">Search</button>
  </div>

  <!-- FULL SETUP MODE -->
  <div id="setupMode" style="display:none">

    <textarea id="setupText" placeholder="Describe your setup:
e.g. RGB gaming setup, creamy white setup, FPS competitive setup"></textarea>

    <input id="budget" type="number" placeholder="Total Budget ($)" />

    <select id="setupSort">
      <option value="best">Best Match</option>
      <option value="low">Price Low → High</option>
      <option value="high">Price High → Low</option>
      <option value="name">Name</option>
    </select>

    <button onclick="buildSetup()">Build Full Setup</button>

  </div>

  <div id="results"></div>

</div>

<script src="app.js"></script>
</body>
</html>
